name: vlink
description: V-LINK Tactical HUD — ESP32 BLE/WiFi HID Controller

publish_to: 'none'
version: 1.0.0

environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State
  provider: 6.1.2

  # BLE
  flutter_blue_plus: 1.31.13

  # Storage
  shared_preferences: 2.2.3

  # UUID
  uuid: 4.4.0

  # Haptics
  vibration: 2.0.0

  # QR scanning (for WebRTC pairing)
  mobile_scanner: 3.5.6

  # QR generation
  qr_flutter: 4.1.0
  reorderables: ^0.6.0

  # WebRTC Dependencies
  flutter_webrtc: ^0.10.3
  socket_io_client: ^3.0.0
  permission_handler: ^11.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: Orbitron
      fonts:
        - asset: assets/fonts/Orbitron-Regular.ttf
        - asset: assets/fonts/Orbitron-Bold.ttf
          weight: 700
    - family: Rajdhani
      fonts:
        - asset: assets/fonts/Rajdhani-Regular.ttf
        - asset: assets/fonts/Rajdhani-Bold.ttf
          weight: 700
    - family: ShareTechMono
      fonts:
        - asset: assets/fonts/ShareTechMono-Regular.ttf