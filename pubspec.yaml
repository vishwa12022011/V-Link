name: vlink
description: V-LINK Tactical HUD — ESP32 BLE/WiFi HID Controller

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: 6.1.2

  # BLE (Central Mode)
  flutter_blue_plus: 1.31.13
  
  # BLE (Peripheral Mode - Added)
  flutter_ble_peripheral: ^2.0.0
  
  # Permissions (Required for Android 14/API 34)
  permission_handler: ^11.0.0

  # Storage
  shared_preferences: 2.2.3

  # UUID
  uuid: 4.4.0

  # Haptics
  vibration: 2.0.0

  # QR scanning (for WebRTC pairing)
  mobile_scanner: 3.5.6

  # QR generation
  qr_flutter: 4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: Orbitron
      fonts:
        - asset: assets/fonts/Orbitron-Regular.ttf
        - asset: assets/fonts/Orbitron-Bold.ttf
          weight: 700
    - family: Rajdhani
      fonts:
        - asset: assets/fonts/Rajdhani-Regular.ttf
        - asset: assets/fonts/Rajdhani-Bold.ttf
          weight: 700
    - family: ShareTechMono
      fonts:
        - asset: assets/fonts/ShareTechMono-Regular.ttf